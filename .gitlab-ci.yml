image: docker:stable

variables:
  # When using dind service we need to instruct docker, to talk with the
  # daemon started inside of the service. The daemon is available with
  # a network connection instead of the default /var/run/docker.sock socket.
  #
  # The 'docker' hostname is the alias of the service container as described at
  # https://docs.gitlab.com/ee/ci/docker/using_docker_images.html#accessing-the-services
  #
  # Note that if you're using Kubernetes executor, the variable should be set to
  # tcp://localhost:2375 because of how Kubernetes executor connects services
  # to the job container
  #DOCKER_HOST: tcp://docker:2375/
  # When using dind, it's wise to use the overlayfs driver for
  # improved performance.
  DOCKER_DRIVER: overlay2
  MOUNT_POINT: /builds/$CI_PROJECT_PATH

services:
  - docker:dind

stages:
  - image
  - build
  - test

buildDocker:
  stage: image
  services:
    - docker:stable-dind
  script:
    - buildDockerImages
  variables:
    DOCKER_DRIVER: overlay2
  tags:
    - building_testing_docker

buildProjekt:
  stage: build
  services:
    - docker:stable-dind
  script:
    - buildingPHP71
    - buildingPHP72
    - buildingPHP73
  variables:
    DOCKER_DRIVER: overlay2
    GIT_STRATEGY: none
  tags:
    - building_testing_docker

testphp71:
  stage: test
  services:
    - docker:stable-dind
  variables:
    DOCKER_DRIVER: overlay2
    GIT_STRATEGY: none
  script:
    - testingPHP71
  tags:
    - building_testing_docker

testphp72:
  stage: test
  services:
    - docker:stable-dind
  variables:
    DOCKER_DRIVER: overlay2
    GIT_STRATEGY: none
  script:
    - testingPHP72
  tags:
    - building_testing_docker

testphp73:
  stage: test
  services:
    - docker:stable-dind
  variables:
    DOCKER_DRIVER: overlay2
    GIT_STRATEGY: none
  allow_failure: true
  script:
    - testingPHP73
  tags:
    - building_testing_docker

code_quality:
  stage: test
  services:
    - docker:stable-dind
  variables:
    DOCKER_DRIVER: overlay2
    GIT_STRATEGY: none
  allow_failure: true
  script:
    - codeQuality
  artifacts:
    reports:
      codequality: [gl-code-quality-report.json]
  tags:
    - building_testing_docker


.methods: &methods |
  export BUILD_SCRIPT_PATH=/builds/tools/scripts/build.sh
  export TESTS_SCRIPT_PATH=/builds/tools/scripts/tests.sh

  function dockerLogin() {
    if [[ -n "$CI_USER_VAR" ]]; then
      echo "Logging to GitLab Container Registry with CI credentials..."
      docker login -u "$CI_USER_VAR" -p "$CI_USER_PW_VAR" "$CI_REGISTRY"
      echo ""
    fi
  }
  function buildDockerImages() {
    docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.1" -f "tools/docker/php7.1/Dockerfile" .
    docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.1"
    docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.2" -f "tools/docker/php7.2/Dockerfile" .
    docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.2"
    docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.3" -f "tools/docker/php7.3/Dockerfile" .
    docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.3"
  }
  function buildingPHP71() {
    ls -la $(pwd)
    ls -la /
    docker run \
      --volume $(pwd):/testing \
      $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.1 \
      bash $BUILD_SCRIPT_PATH /testing

    docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.1"
  }
  function buildingPHP72() {
    docker run \
      $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.2 \
      bash $BUILD_SCRIPT_PATH /testing

    docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.2"
  }
  function buildingPHP73() {
    docker run \
      $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.3 \
      bash $BUILD_SCRIPT_PATH /testing

    docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.3"
  }
  function testingPHP71() {
    docker run \
      $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.1 \
      bash $TESTS_SCRIPT_PATH /testing
  }
  function testingPHP72() {
    docker run \
      $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.2 \
      bash $TESTS_SCRIPT_PATH /testing
  }
  function testingPHP73() {
    docker run \
      $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-php7.3 \
      bash $TESTS_SCRIPT_PATH /testing
  }
  function codeQuality() {
    export SP_VERSION=$(echo "$CI_SERVER_VERSION" | sed 's/^\([0-9]*\)\.\([0-9]*\).*/\1-\2-stable/')
    $PWD
    ls -la /
    ls -la $PWD
    docker run \
      --env SOURCE_CODE="$PWD" \
      --volume "$PWD":/code \
      --volume /var/run/docker.sock:/var/run/docker.sock \
      "registry.gitlab.com/gitlab-org/security-products/codequality:$SP_VERSION" /code
  }

before_script:
 - *methods
 - dockerLogin