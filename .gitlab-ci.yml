image: docker:stable

variables:
  # When using dind service we need to instruct docker, to talk with the
  # daemon started inside of the service. The daemon is available with
  # a network connection instead of the default /var/run/docker.sock socket.
  #
  # The 'docker' hostname is the alias of the service container as described at
  # https://docs.gitlab.com/ee/ci/docker/using_docker_images.html#accessing-the-services
  #
  # Note that if you're using Kubernetes executor, the variable should be set to
  # tcp://localhost:2375 because of how Kubernetes executor connects services
  # to the job container
  #DOCKER_HOST: tcp://docker:2375/
  # When using dind, it's wise to use the overlayfs driver for
  # improved performance.
  DOCKER_DRIVER: overlay2
  MOUNT_POINT: /builds/$CI_PROJECT_PATH

services:
  - docker:dind

stages:
  - build
  - test

building:
  stage: build
  services:
    - docker:stable-dind
  script:
    - building
  tags:
    - building_testing_docker

code_quality:
  stage: test
  services:
    - docker:stable-dind
  variables:
    DOCKER_DRIVER: overlay2
    GIT_STRATEGY: none
  allow_failure: true
  script:
    - codeQuality
  artifacts:
    reports:
      codequality: [gl-code-quality-report.json]
  tags:
  - building_testing_docker


.methods: &methods |
  function building() {
    docker run \
      $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG \
      bash /builds/tools/build.sh
  }
  function codeQuality() {
    export SP_VERSION=$(echo "$CI_SERVER_VERSION" | sed 's/^\([0-9]*\)\.\([0-9]*\).*/\1-\2-stable/')
    ls -la $PWD
    docker run \
      --env SOURCE_CODE="$PWD" \
      --volume "$PWD":/code \
      --volume /var/run/docker.sock:/var/run/docker.sock \
      "registry.gitlab.com/gitlab-org/security-products/codequality:$SP_VERSION" /code
  }
  function dockerLogin() {
    if [[ -n "$CI_USER_VAR" ]]; then
      echo "Logging to GitLab Container Registry with CI credentials..."
      docker login -u "$CI_USER_VAR" -p "$CI_USER_PW_VAR" "$CI_REGISTRY"
      echo ""
    fi
  }
  function buildImage() {
    docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" -f "Dockerfile" .
    docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  }

before_script:
 - *methods
 - dockerLogin
 - buildImage